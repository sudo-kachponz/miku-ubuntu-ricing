# 3-finger swipe left/right to switch workspace (1-5 wrap around)
gesture swipe right 3 bash -c 'cur=$(hyprctl activeworkspace -j | python3 -c "import sys,json;print(json.loads(sys.stdin.read())[\"id\"])"); next=$(( cur - 1 )); [ $next -lt 1 ] && next=5; hyprctl dispatch workspace $next'
gesture swipe left 3 bash -c 'cur=$(hyprctl activeworkspace -j | python3 -c "import sys,json;print(json.loads(sys.stdin.read())[\"id\"])"); next=$(( cur + 1 )); [ $next -gt 5 ] && next=1; hyprctl dispatch workspace $next'
