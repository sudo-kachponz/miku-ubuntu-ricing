# hyprlock — lockscreen blur + palette pink/teal. Install: nix profile install nixpkgs#hyprlock
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.2
}

# input field
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(E85880)
    inner_color = rgb(1A2D38)
    font_color = rgb(D8F0F0)
    fade_on_empty = false
    placeholder_text = <span foreground="##D8F0F0">  masukin password...</span>
    check_color = rgb(39B5B5)
    fail_color = rgb(2DD4C0)
    fail_text = <span foreground="##E85880">salah ($ATTEMPTS)</span>
    rounding = 18
    position = 0, -60
    halign = center
    valign = center
}

# jam gede
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgb(E85880)
    font_size = 110
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 180
    halign = center
    valign = center
}

# tanggal
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color = rgb(D8F0F0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# user
label {
    monitor =
    text =   firania
    color = rgb(39B5B5)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 10
    halign = center
    valign = bottom
}
